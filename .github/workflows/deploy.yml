# Builds the site on every push to master and deploys it to GitHub Pages (gh-pages branch).
# Pull requests are built too, but not deployed.

name: Build and deploy

on:
  push:
    branches: [master]
    paths-ignore: ['README.md', 'CLAUDE.md', 'AGENTS.md', 'LICENSE']
  pull_request:
    paths-ignore: ['README.md', 'CLAUDE.md', 'AGENTS.md', 'LICENSE']
  workflow_dispatch:

# One run at a time per branch; a newer push cancels the pending one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Full history (for the last modification dates of the sitemap), without the file contents of old commits
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - name: Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: nextjs-${{ hashFiles('package-lock.json') }}-

      - run: npm run build

      - name: Deploy to gh-pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          commit_message: Deploy
